<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WKSC Class Flags</title>

<link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<div class="container">

    <div class="header">
        <h1>⛵ WKSC Class Flags</h1>
        <p>Class Identifiers Used At WKSC</p>
    </div>

    <div class="flags-section">

        <div class="flags-intro">
            These flags are used at WKSC to identify fleets and classes
            during racing and tidal sailing.
        </div>

        <div class="flag-grid">

            <!-- STAR -->

            <div class="flag-card">
                <img src="../assets/flags/flag-e.gif" class="small-flag">

                <div class="flag-title">E</div>

                <div class="flag-desc">
                    Star Class
                </div>
            </div>

            <!-- HILBRE -->

            <div class="flag-card">
                <img src="../assets/flags/flag-i.gif" class="small-flag">

                <div class="flag-title">I</div>

                <div class="flag-desc">
                    Hilbre Class
                </div>
            </div>

            <!-- FALCON -->

            <div class="flag-card">
                <img src="../assets/flags/flag-r.gif" class="small-flag">

                <div class="flag-title">R</div>

                <div class="flag-desc">
                    Falcon Class
                </div>
            </div>

            <!-- HANDICAP TIDAL -->

            <div class="flag-card">
                <img src="../assets/flags/flag-w.gif" class="small-flag">

                <div class="flag-title">S</div>

                <div class="flag-desc">
                    Handicap Tidal
                </div>
            </div>

            <!-- CRUISERS -->

            <div class="flag-card">
                <img src="../assets/flags/flag-d.gif" class="small-flag">

                <div class="flag-title">D</div>

                <div class="flag-desc">
                    Cruisers
                </div>
            </div>

            <!-- ILCA -->

            <div class="flag-card">
                <img src="../assets/flags/flag-l.gif" class="small-flag">

                <div class="flag-title">L</div>

                <div class="flag-desc">
                    ILCA (Laser)
                </div>
            </div>
        </div>

    </div>

    <div class="footer">
        WKSC Class Flags
    </div>

</div>

</body>
</html>
